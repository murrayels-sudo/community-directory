<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Directory</title>
<meta name="theme-color" content="#1F3A3D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Directory">
<style>
  :root{
    --teal-900:#1F3A3D;
    --teal-700:#2B4C4F;
    --sage-100:#E7EFE9;
    --sage-50:#F4F8F5;
    --white:#FFFFFF;
    --ink:#24312F;
    --ink-soft:#5B6A64;
    --gold-500:#C69C4E;
    --gold-600:#A9803C;
    --open-green:#3F8E5B;
    --closed-gray:#8A948F;
    --line:#DCE6DF;
    --radius:14px;
    --focus:#2E6E90;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sage-100);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit;}
  header.top{
    background:var(--teal-900);
    color:var(--sage-50);
    padding:20px 18px 22px;
    padding-top:calc(20px + env(safe-area-inset-top));
    border-radius:0 0 20px 20px;
  }
  header.top h1{
    margin:0 0 4px;
    font-size:1.35rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header.top p.sub{
    margin:0;
    font-size:0.88rem;
    color:#B9CBC3;
  }
  .search-wrap{
    padding:16px 16px 4px;
    max-width:640px;
    margin:0 auto;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:var(--white);
    border-radius:12px;
    padding:0 14px;
    box-shadow:0 1px 3px rgba(31,58,61,0.12);
    border:1px solid var(--line);
  }
  .search-box svg{flex-shrink:0;color:var(--ink-soft);}
  .search-box input{
    border:0;
    outline:0;
    background:transparent;
    padding:14px 10px;
    font-size:1rem;
    width:100%;
    color:var(--ink);
  }
  .search-box input:focus-visible{outline:2px solid var(--focus);border-radius:6px;}

  .suburb-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 16px 4px;
    max-width:640px;
    margin:0 auto;
    -webkit-overflow-scrolling:touch;
  }
  .chip{
    flex-shrink:0;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    padding:9px 15px;
    border-radius:999px;
    font-size:0.9rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .chip.active{
    background:var(--teal-900);
    color:var(--white);
    border-color:var(--teal-900);
    font-weight:600;
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:12px 16px 40px;
  }

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    padding:8px 2px 12px;
  }

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    margin:0 0 4px;
    font-size:1.08rem;
    font-weight:700;
    color:var(--teal-900);
  }
  .addr{
    font-size:0.92rem;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .status-line{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:0.88rem;
    margin-bottom:6px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--closed-gray);
    flex-shrink:0;
  }
  .dot.open{background:var(--open-green);}
  .status-line.open{color:var(--open-green);font-weight:600;}
  .status-line.closed{color:var(--ink-soft);}
  .hours-text{color:var(--ink-soft);}

  .services{
    font-size:0.92rem;
    color:var(--ink);
    background:var(--sage-50);
    border-radius:10px;
    padding:10px 12px;
    margin:10px 0 12px;
    line-height:1.4;
  }

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .action-btn{
    display:flex;
    align-items:center;
    gap:6px;
    padding:11px 14px;
    border-radius:10px;
    text-decoration:none;
    font-size:0.9rem;
    font-weight:600;
    border:1px solid transparent;
    min-height:44px;
  }
  .action-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .action-btn.call{background:var(--gold-500);color:var(--teal-900);}
  .action-btn.call:hover{background:var(--gold-600);}
  .action-btn.dir{background:var(--teal-900);color:var(--white);}
  .action-btn.web,.action-btn.mail{background:var(--sage-50);color:var(--teal-900);border-color:var(--line);}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:60px 20px;
    font-size:0.95rem;
  }

  .offline-banner{
    display:none;
    background:#FCEFD9;
    color:#7A5A17;
    font-size:0.82rem;
    text-align:center;
    padding:7px;
  }
  .offline-banner.show{display:block;}

  @media (prefers-reduced-motion:no-preference){
    .card{transition:transform 0.15s ease;}
  }
</style>
</head>
<body>

<div class="offline-banner" id="offlineBanner">You're offline — showing the last saved copy of this directory.</div>

<header class="top">
  <h1>Community Directory</h1>
  <p class="sub" id="orgCount">Loading local support services…</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search by organisation name" autocomplete="off" aria-label="Search by organisation name">
  </div>
</div>

<div class="suburb-scroll" id="suburbScroll" role="tablist" aria-label="Filter by suburb"></div>

<main>
  <div class="meta-row">
    <span id="resultCount"></span>
    <span id="lastUpdated"></span>
  </div>
  <div id="cardList"></div>
  <div class="empty" id="emptyState" style="display:none;">No matching services found. Try a different search or suburb.</div>
</main>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "communityDirectoryData";
  var state = { orgs: [], suburb: "All", query: "" };

  // ---------- Load data: show cache instantly, refresh from network if possible ----------
  function loadDirectory(){
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){}

    if(cached && cached.orgs){
      applyData(cached, true);
    }

    fetch("directory.json", { cache: "no-store" })
      .then(function(res){ return res.json(); })
      .then(function(data){
        var isNew = !cached || cached.version !== data.version;
        if(isNew){
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        applyData(data, false);
        setOffline(false);
      })
      .catch(function(){
        if(!cached){
          document.getElementById("orgCount").textContent = "No connection yet — open this app once online to download the directory.";
        }
        setOffline(true);
      });
  }

  function setOffline(isOffline){
    var b = document.getElementById("offlineBanner");
    if(isOffline){ b.classList.add("show"); } else { b.classList.remove("show"); }
  }

  function applyData(data, fromCacheOnly){
    state.orgs = data.orgs || [];
    document.getElementById("lastUpdated").textContent = data.updated_display ? ("Updated " + data.updated_display) : "";
    buildSuburbChips();
    render();
  }

  // ---------- Suburb chips ----------
  function buildSuburbChips(){
    var wrap = document.getElementById("suburbScroll");
    var suburbs = Array.from(new Set(state.orgs.map(function(o){ return o.suburb; }).filter(Boolean))).sort();
    wrap.innerHTML = "";
    var all = ["All"].concat(suburbs);
    all.forEach(function(s){
      var chip = document.createElement("button");
      chip.className = "chip" + (state.suburb === s ? " active" : "");
      chip.textContent = s;
      chip.type = "button";
      chip.addEventListener("click", function(){
        state.suburb = s;
        buildSuburbChips();
        render();
      });
      wrap.appendChild(chip);
    });
  }

  // ---------- Search ----------
  document.getElementById("searchInput").addEventListener("input", function(e){
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  // ---------- Open-now detection (best-effort, never blocks rendering) ----------
  var DAY_MAP = { sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6 };
  function parseDays(daysStr){
    try{
      if(!daysStr) return null;
      var s = daysStr.toLowerCase();
      if(s.indexOf("7 day") !== -1 || s.indexOf("every day") !== -1 || s.indexOf("daily") !== -1){
        return [0,1,2,3,4,5,6];
      }
      var days = new Set();
      s.split(",").forEach(function(part){
        part = part.trim();
        if(part.indexOf("-") !== -1){
          var range = part.split("-").map(function(x){ return x.trim().slice(0,3); });
          var startIdx = DAY_MAP[range[0]], endIdx = DAY_MAP[range[1]];
          if(startIdx === undefined || endIdx === undefined) return;
          var i = startIdx;
          while(true){
            days.add(i);
            if(i === endIdx) break;
            i = (i + 1) % 7;
          }
        } else {
          var idx = DAY_MAP[part.slice(0,3)];
          if(idx !== undefined) days.add(idx);
        }
      });
      return days.size ? Array.from(days) : null;
    } catch(e){ return null; }
  }

  function parseTimeToMinutes(t){
    var m = t.trim().toLowerCase().match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
    if(!m) return null;
    var h = parseInt(m[1], 10);
    var min = m[2] ? parseInt(m[2], 10) : 0;
    var ap = m[3];
    if(ap === "pm" && h !== 12) h += 12;
    if(ap === "am" && h === 12) h = 0;
    return h * 60 + min;
  }

  function getOpenStatus(org){
    try{
      var hours = (org.hours || "").toLowerCase();
      var dayIndexes = parseDays(org.days);
      if(dayIndexes === null) return null;

      var now = new Date();
      var isToday = dayIndexes.indexOf(now.getDay()) !== -1;
      if(!isToday) return { open: false, label: "Closed today" };

      if(hours.indexOf("24 hour") !== -1) return { open: true, label: "Open now · 24 hours" };

      var parts = org.hours.split("-");
      if(parts.length !== 2) return null;
      var start = parseTimeToMinutes(parts[0]);
      var end = parseTimeToMinutes(parts[1]);
      if(start === null || end === null) return null;

      var nowMin = now.getHours() * 60 + now.getMinutes();
      var isOpen = nowMin >= start && nowMin <= end;
      return { open: isOpen, label: isOpen ? "Open now" : "Closed now" };
    } catch(e){ return null; }
  }

  // ---------- Render ----------
  function render(){
    var list = state.orgs.filter(function(o){
      var matchesSuburb = state.suburb === "All" || o.suburb === state.suburb;
      var matchesQuery = !state.query || (o.name || "").toLowerCase().indexOf(state.query) !== -1;
      return matchesSuburb && matchesQuery;
    });

    document.getElementById("orgCount").textContent = state.orgs.length + " local support services";
    document.getElementById("resultCount").textContent = list.length + (list.length === 1 ? " result" : " results");

    var container = document.getElementById("cardList");
    var empty = document.getElementById("emptyState");
    container.innerHTML = "";

    if(list.length === 0){
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    list.forEach(function(o){
      container.appendChild(buildCard(o));
    });
  }

  function esc(str){
    var d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  function buildCard(o){
    var el = document.createElement("article");
    el.className = "card";

    var status = getOpenStatus(o);
    var statusHtml = "";
    if(status){
      statusHtml = '<div class="status-line ' + (status.open ? "open" : "closed") + '">' +
        '<span class="dot' + (status.open ? " open" : "") + '"></span>' + esc(status.label) + '</div>';
    }
    var scheduleHtml = '<div class="hours-text">' + esc(o.days) + (o.days && o.hours ? " · " : "") + esc(o.hours) + '</div>';

    var addressParts = [o.address, o.suburb].filter(Boolean).join(", ");
    var mapsUrl = "https://maps.google.com/?q=" + encodeURIComponent(addressParts);

    var actions = "";
    if(o.phone){
      actions += '<a class="action-btn call" href="tel:' + esc(o.phone.replace(/\s+/g,"")) + '">Call</a>';
    }
    if(addressParts){
      actions += '<a class="action-btn dir" href="' + mapsUrl + '" target="_blank" rel="noopener">Directions</a>';
    }
    if(o.website){
      actions += '<a class="action-btn web" href="' + esc(o.website) + '" target="_blank" rel="noopener">Website</a>';
    }
    if(o.email){
      actions += '<a class="action-btn mail" href="mailto:' + esc(o.email) + '">Email</a>';
    }

    el.innerHTML =
      '<h2>' + esc(o.name) + '</h2>' +
      '<p class="addr">' + esc(addressParts) + '</p>' +
      statusHtml +
      scheduleHtml +
      (o.services ? '<div class="services">' + esc(o.services) + '</div>' : '') +
      '<div class="actions">' + actions + '</div>';

    return el;
  }

  // ---------- Service worker ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  window.addEventListener("online", function(){ setOffline(false); loadDirectory(); });
  window.addEventListener("offline", function(){ setOffline(true); });

  loadDirectory();
})();
</script>
</body>
</html>
